<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Parlor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="sound.js"></script>
<script>window.sfx=window.sfx||function(){}</script>
</head>
<body>
<style>
/* Layout: a game shelf. Header with "ready to play" strip, sticky search/sort/layout bar, filter chips, then an infinitely loading catalog in grid, table or big-image scroll layout. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --ink:#171a2c; --muted:#5d627a; --line:#dcdfea; --chip:#f2f3f9;
  --accent:#f0532f; --accent-ink:#ffffff; --blue:#2c58c4; --ok:#1d9a62; --soon:#8a8fa8;
  --display:"Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121f; --surface:#191c2f; --ink:#eceef8; --muted:#9ba1bf; --line:#2a2e48; --chip:#21253c;
  --accent:#ff6a48; --accent-ink:#1a0700; --blue:#7d9cff; --ok:#3fcf8c; --soon:#7d829c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10121f; --surface:#191c2f; --ink:#eceef8; --muted:#9ba1bf; --line:#2a2e48; --chip:#21253c;
  --accent:#ff6a48; --accent-ink:#1a0700; --blue:#7d9cff; --ok:#3fcf8c; --soon:#7d829c; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:inherit}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* header */
header{padding-block:28px 18px;display:flex;flex-direction:column;gap:18px}
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,60px);line-height:.95;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.tag{margin:8px 0 0;color:var(--muted);max-width:52ch;font-size:16px}
.tally{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.tally b{color:var(--ink)}
.ready{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.ready{grid-template-columns:minmax(0,1fr)}}
.rcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.rcard:hover{border-color:var(--accent)}
.rcard .cv{aspect-ratio:16/10;max-width:100%}
.rcard .tx{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.05;margin:0}
.rcard p{margin:0;color:var(--muted);font-size:13.5px}
.rcard .go{margin-top:auto}
@media (max-width:460px){.rcard{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.barin{display:flex;gap:10px;align-items:center;padding-block:10px;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.search:focus-within{border-color:var(--blue)}
.search input{flex:1;border:0;background:none;padding:10px 0;outline:none;min-width:0;font-size:15px}
.search kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.sel{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button svg{width:26px;height:18px;display:block}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn.fbtn{display:none}
@media (max-width:700px){.seg button span{display:none}.btn.fbtn{display:inline-flex}}
@media (pointer:coarse){.seg button{min-height:38px;min-width:44px;justify-content:center}.chip{min-height:38px}}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.play:hover{filter:brightness(1.05)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px;padding-block:14px 4px}
@media (max-width:700px){.filters{display:none}.filters.open{display:flex}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.chip:disabled{opacity:.4;cursor:default}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow label.tg{display:inline-flex;gap:7px;align-items:center;font-weight:700;font-size:13px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
.frow label.tg input{accent-color:var(--accent);margin:0}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px 10px;color:var(--muted);font-size:13.5px}
.status b{color:var(--ink);font-family:var(--mono);font-weight:500}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:0}

/* shared item bits */
.cv{position:relative;display:block;overflow:hidden;background:var(--chip)}
.cv svg{display:block;width:100%;height:100%}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:rgba(15,17,30,.72);color:#fff;backdrop-filter:blur(4px)}
.badge.ok{background:#1d9a62}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(15,17,30,.55);display:grid;place-items:center;cursor:pointer;color:#fff}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{background:#fff;color:#e2365b}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:6px;padding:1px 7px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.diff{display:inline-flex;gap:3px;align-items:center}
.diff i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.diff i.on{background:var(--accent)}

/* tiles: square cover + name only (default) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}}
.tile{display:flex;flex-direction:column;gap:7px;color:inherit;text-decoration:none;border:0;background:none;padding:0;font:inherit;text-align:center;cursor:pointer;min-width:0}
.tile .cv{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 8px 18px -12px rgba(20,25,60,.45);transition:transform .15s}
.tile:hover .cv,.tile:focus-visible .cv{transform:translateY(-3px)}
.tile .nm{font-weight:800;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.tile.soon .cv svg{filter:saturate(.45) brightness(.92)}
.tile.soon .nm{color:var(--muted);font-weight:700}
.tile .soonb{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:800;letter-spacing:.04em;background:rgba(23,26,44,.72);color:#fff;border-radius:999px;padding:2px 8px}
body.tiles-view .readywrap{display:none}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--muted)}
.card .cv{aspect-ratio:16/10;max-width:100%}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{margin:0;font-size:17px;font-weight:800;line-height:1.2}
.card.soon .cv svg{filter:saturate(.75)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th button{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px}
th button.on{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--chip)}
tbody tr:last-child td{border-bottom:0}
.tthumb{width:76px;height:48px;border-radius:8px;overflow:hidden;flex:none}
.tname{display:flex;gap:12px;align-items:center;font-weight:800}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.soon{background:var(--chip);color:var(--soon)}

/* scroll feed */
.feed{display:flex;flex-direction:column;gap:26px}
.big{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.big .cv{aspect-ratio:16/10;max-width:100%}
.big .bd{padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.big h3{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1;margin:0}
.big p{margin:0;color:var(--muted);font-size:15.5px;max-width:46ch}
.big .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.big .stats div{background:var(--chip);border-radius:10px;padding:8px 10px}
.big .stats small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big .stats b{font-family:var(--mono);font-weight:500;font-size:13px}
.big:hover{border-color:var(--muted)}
.big .idx{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:820px){.big{grid-template-columns:minmax(0,1fr)}.big .bd{padding:16px}}

/* skeleton + end */
.skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;margin-top:16px}
.skel.list{grid-template-columns:minmax(0,1fr)}
.sk{border-radius:16px;background:linear-gradient(100deg,var(--chip) 30%,var(--line) 50%,var(--chip) 70%);background-size:300% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.end{text-align:center;color:var(--muted);padding-block:34px 60px;display:flex;flex-direction:column;gap:8px;align-items:center}
.end strong{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
#sentinel{height:1px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.62);z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;max-width:620px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column}
.modal .cv{aspect-ratio:16/9;max-width:100%}
.modal .bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);line-height:1;margin:0}
.modal p{margin:0;color:var(--muted)}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.mstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mstats div{background:var(--chip);border-radius:10px;padding:8px 10px}
.mstats small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mstats b{font-size:13.5px}
.feats{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(10,12,22,.6);color:#fff;font-size:20px;cursor:pointer;line-height:1}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.card{transition:none}.card:hover{transform:none}}
</style>

<div class="wrap">
  <header>
    <div class="mast">
      <div>
        <h1>Game <span>Parlor</span><span data-sound></span></h1>
        <p class="tag">Board, card and puzzle games you can play in your browser. Search the shelf, filter by how long you've got, and pick one.</p>
      </div>
      <div class="tally" id="tally"></div>
    </div>
    <div class="readywrap">
      <p class="eyebrow" style="margin-bottom:10px">Ready to play now</p>
      <div class="ready" id="ready"></div>
    </div>
  </header>
</div>

<div class="bar">
  <div class="wrap barin">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search games, e.g. dice, cards, strategy" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <select class="sel" id="sort" aria-label="Sort">
      <option value="featured">Featured</option>
      <option value="az">A to Z</option>
      <option value="short">Quickest first</option>
      <option value="long">Longest first</option>
      <option value="easy">Easiest first</option>
      <option value="hard">Hardest first</option>
    </select>
    <div class="seg" role="group" aria-label="Layout" id="layouts">
      <button data-l="tiles" aria-pressed="true" title="Tiles"><svg viewBox="0 0 26 18" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5" rx="1.8" fill="currentColor"/><rect x="9.75" y="1" width="6.5" height="6.5" rx="1.8" fill="currentColor"/><rect x="18.5" y="1" width="6.5" height="6.5" rx="1.8" fill="currentColor"/><rect x="1.5" y="9.5" width="5.5" height="1.6" rx=".8" fill="currentColor" opacity=".6"/><rect x="10.25" y="9.5" width="5.5" height="1.6" rx=".8" fill="currentColor" opacity=".6"/><rect x="19" y="9.5" width="5.5" height="1.6" rx=".8" fill="currentColor" opacity=".6"/><rect x="1" y="13" width="6.5" height="4" rx="1.4" fill="currentColor" opacity=".4"/><rect x="9.75" y="13" width="6.5" height="4" rx="1.4" fill="currentColor" opacity=".4"/><rect x="18.5" y="13" width="6.5" height="4" rx="1.4" fill="currentColor" opacity=".4"/></svg><span>Tiles</span></button>
      <button data-l="grid" aria-pressed="false" title="Grid"><svg viewBox="0 0 26 18" aria-hidden="true"><rect x="1" y="1" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="9.5" y="1" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="18" y="1" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="1" y="10" width="7" height="7" rx="1.5" fill="currentColor" opacity=".55"/><rect x="9.5" y="10" width="7" height="7" rx="1.5" fill="currentColor" opacity=".55"/><rect x="18" y="10" width="7" height="7" rx="1.5" fill="currentColor" opacity=".55"/></svg><span>Grid</span></button>
      <button data-l="table" aria-pressed="false" title="Table"><svg viewBox="0 0 26 18" aria-hidden="true"><rect x="1" y="1" width="24" height="3.5" rx="1" fill="currentColor"/><rect x="1" y="7" width="5" height="3" rx=".8" fill="currentColor" opacity=".7"/><rect x="8" y="7.5" width="17" height="2" rx="1" fill="currentColor" opacity=".55"/><rect x="1" y="12.5" width="5" height="3" rx=".8" fill="currentColor" opacity=".7"/><rect x="8" y="13" width="17" height="2" rx="1" fill="currentColor" opacity=".55"/></svg><span>Table</span></button>
      <button data-l="scroll" aria-pressed="false" title="Scroll"><svg viewBox="0 0 26 18" aria-hidden="true"><rect x="1" y="1" width="15" height="10" rx="2" fill="currentColor"/><rect x="18" y="2" width="7" height="2" rx="1" fill="currentColor" opacity=".7"/><rect x="18" y="5.5" width="5" height="1.6" rx=".8" fill="currentColor" opacity=".5"/><rect x="1" y="13" width="15" height="5" rx="1.5" fill="currentColor" opacity=".45"/><rect x="18" y="13.5" width="7" height="2" rx="1" fill="currentColor" opacity=".45"/></svg><span>Scroll</span></button>
    </div>
    <button class="btn fbtn" id="fbtn" aria-expanded="false">Filters</button>
  </div>
</div>

<main class="wrap">
  <section class="filters" id="filters" aria-label="Filters">
    <div class="chips" id="genres"></div>
    <div class="frow">
      <select class="sel" id="players" aria-label="Players">
        <option value="any">Any players</option><option value="solo">Solo</option><option value="cpu">Vs computer</option><option value="two">2 players</option><option value="group">3+ players</option>
      </select>
      <select class="sel" id="len" aria-label="Length">
        <option value="any">Any length</option><option value="quick">Under 10 min</option><option value="mid">10 to 30 min</option><option value="long">Over 30 min</option>
      </select>
      <select class="sel" id="diff" aria-label="Difficulty">
        <option value="any">Any difficulty</option><option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option>
      </select>
      <label class="tg"><input type="checkbox" id="playable"> Playable now</label>
      <label class="tg"><input type="checkbox" id="favs"> Favorites</label>
    </div>
  </section>
  <div class="status"><span id="count"></span><button class="linkbtn" id="clear" hidden>Clear all filters</button></div>
  <div id="results"></div>
  <div id="skel" hidden></div>
  <div id="sentinel"></div>
  <div class="end" id="end" hidden></div>
</main>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div></div>

<script>
/* ---------- catalog ---------- */
const GAMES=[
 {id:'hexhaven',name:'Hexhaven',genres:['Strategy','Classic board'],p:['cpu'],plabel:'You vs 3 computer players',mins:45,diff:2,motif:'hex',pal:['#2c7f9c'],
  blurb:'Settle a hex island, trade lumber, brick, wool, grain and ore, and race three rivals to 10 points.',url:'hexhaven.html',
  feats:['A new random island every game','Robber, harbors and development cards','Longest Road and Largest Army bonuses','Trade with the bank or offer deals to rivals']},

/* ---------- state ---------- */
const $=id=>document.getElementById(id);

const S={q:'',genres:new Set(),players:'any',len:'any',diff:'any',playable:false,fav:false,sort:'featured',layout:store.get('parlor-layout-v2','tiles')};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function matches(g,skip){
  const w=words();if(w.length){const hay=(g.name+' '+g.genres.join(' ')+' '+g.blurb+' '+g.plabel).toLowerCase();if(!w.every(x=>hay.includes(x)))return false}
  if(skip!=='genres'&&S.genres.size&&!g.genres.some(x=>S.genres.has(x)))return false;
  if(S.players!=='any'&&!g.p.includes(S.players))return false;
  if(S.len==='quick'&&!(g.mins<10))return false;if(S.len==='mid'&&!(g.mins>=10&&g.mins<=30))return false;if(S.len==='long'&&!(g.mins>30))return false;

function compute(){const l=GAMES.filter(g=>matches(g));const by={featured:(a,b)=>(!!b.url-!!a.url)||a.order-b.order,az:(a,b)=>a.name.localeCompare(b.name),short:(a,b)=>a.mins-b.mins||a.name.localeCompare(b.name),long:(a,b)=>b.mins-a.mins||a.name.localeCompare(b.name),easy:(a,b)=>a.diff-b.diff||a.name.localeCompare(b.name),hard:(a,b)=>b.diff-a.diff||a.name.localeCompare(b.name)};return l.sort(by[S.sort])}

/* ---------- item templates ---------- */

function closeModal(){$('overlay').hidden=true}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);store.set('parlor-favs',[...favs]);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',favs.has(id));b.setAttribute('aria-label',(favs.has(id)?'Remove from':'Add to')+' favorites')});
  if(S.fav)refresh();else renderChips()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]'))return;
  const fv=e.target.closest('[data-fav]');if(fv){e.stopPropagation();toggleFav(fv.dataset.fav);return}
  const f2=e.target.closest('[data-fav2]');if(f2){toggleFav(f2.dataset.fav2);openGame(f2.dataset.fav2);return}
  if(e.target.closest('[data-clear]')){clearAll();return}
  if(e.target.id==='totop'){scrollTo({top:0,behavior:'smooth'});return}
  const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;S.sort=k==='az'?'az':k==='len'?(S.sort==='short'?'long':'short'):(S.sort==='easy'?'hard':'easy');$('sort').value=S.sort;refresh();return}
  const op=e.target.closest('[data-open]');if(op&&$('overlay').hidden){openGame(op.dataset.open);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('overlay').hidden){closeModal();return}
  if(e.key==='/'&&document.activeElement!==$('q')&&$('overlay').hidden){e.preventDefault();$('q').focus();return}
  if(e.key==='Enter'){const op=e.target.closest&&e.target.closest('[data-open]');if(op&&e.target===op)openGame(op.dataset.open)}
});
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay'||e.target.closest('#mclose'))closeModal()});
let qt;$('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();refresh()},160)});
$('sort').onchange=e=>{S.sort=e.target.value;refresh()};
['players','len','diff'].forEach(k=>$(k).onchange=e=>{S[k]=e.target.value;refresh()});
$('playable').onchange=e=>{S.playable=e.target.checked;refresh()};
$('favs').onchange=e=>{S.fav=e.target.checked;refresh()};
$('genres').addEventListener('click',e=>{const c=e.target.closest('[data-g]');if(!c||c.disabled)return;const g=c.dataset.g;if(!g)S.genres.clear();else S.genres.has(g)?S.genres.delete(g):S.genres.add(g);refresh()});
$('layouts').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;S.layout=b.dataset.l;store.set('parlor-layout-v2',S.layout);refresh()});
$('fbtn').onclick=()=>{const f=$('filters');f.classList.toggle('open');$('fbtn').setAttribute('aria-expanded',f.classList.contains('open'))};
$('clear').onclick=clearAll;
function clearAll(){S.q='';S.genres.clear();S.players=S.len=S.diff='any';S.playable=S.fav=false;$('q').value='';['players','len','diff'].forEach(k=>$(k).value='any');$('playable').checked=$('favs').checked=false;refresh()}
new IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore()},{rootMargin:'500px 0px'}).observe($('sentinel'));
if(!['tiles','grid','table','scroll'].includes(S.layout))S.layout='tiles';
renderTop();refresh();
</script>

</body>
</html>

name: Deploy website

# Publishes the games as a website: builds the same web bundle the Android app uses (www/, with fonts stored
# locally) and uploads it to an S3 bucket served through CloudFront.
#
# Needs these repository variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN                 the IAM role GitHub signs in as (no AWS keys are stored in GitHub)
#   AWS_REGION                   the bucket's region, e.g. ap-south-1
#   S3_BUCKET                    the bucket name
#   CLOUDFRONT_DISTRIBUTION_ID   the CloudFront distribution in front of the bucket
# Until AWS_ROLE_ARN is set the job is skipped, so this does nothing before AWS is ready.

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'app-shell/**'
      - 'scripts/build-web.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub sign in to AWS with a short-lived token

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web bundle
        run: |
          npm ci
          npm run build:web
          echo "Files: $(find www -type f | wc -l), size: $(du -sh www | cut -f1)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pages are checked for updates on every visit; scripts, fonts and images may be cached for a day.
      - name: Upload to S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync www "s3://$BUCKET" --delete --exclude "*.html" --cache-control "public,max-age=86400"
          aws s3 sync www "s3://$BUCKET" --delete --exclude "*" --include "*.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Refresh CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" --query 'Invalidation.Id' --output text

      - name: Site address
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: echo "Live at https://$(aws cloudfront get-distribution --id '${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}' --query 'Distribution.DomainName' --output text)/"
